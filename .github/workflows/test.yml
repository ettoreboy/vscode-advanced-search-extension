name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      # The extension host needs a display, so the tests run under a virtual one.
      # The platform specific code paths mock process.platform, so this single
      # Linux runner still covers the Windows and macOS branches.
      - name: Run tests
        run: xvfb-run -a npm test
